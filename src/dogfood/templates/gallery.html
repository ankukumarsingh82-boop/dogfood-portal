{% extends "base.html" %}
{% block title %}Gallery · {{ event.name }}{% endblock %}
{% block body %}
<div class="page">
  <p class="mono"><a href="/e/{{ event.slug }}">{{ event.name }}</a></p>
  <h1>Gallery</h1>
  <p class="muted">Submitted projects only. Drafts stay on the team’s desk.</p>
  <form class="filters" method="get" action="/e/{{ event.slug }}/gallery"
        hx-get="/e/{{ event.slug }}/gallery" hx-target="#results" hx-swap="innerHTML"
        hx-push-url="true" hx-trigger="submit, change, keyup delay:300ms from:input[name=q]">
    <label><span>Search</span><input type="search" name="q" value="{{ q }}" placeholder="Name, tagline, description, tag"></label>
    <label><span>Track</span>
      <select name="track">
        <option value="">All tracks</option>
        {% for item in tracks %}
          <option value="{{ item.slug }}" {% if track == item.slug %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label><span>Tag</span>
      <select name="tag">
        <option value="">All tags</option>
        {% for item in tags %}
          <option value="{{ item }}" {% if tag == item %}selected{% endif %}>{{ item }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Filter</button>
  </form>
  <div id="results">
    {% include "gallery_results.html" %}
  </div>
</div>
{% endblock %}
