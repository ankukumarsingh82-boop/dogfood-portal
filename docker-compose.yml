# One command: docker compose up --build
# Portal: http://localhost:8000
# Postgres is local to this compose file. No cloud account and no external API.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_DB: dogfood
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://dogfood:dogfood@db:5432/dogfood
      SEED_ON_START: "1"
      SEED_FORCE: "0"
      COOKIE_SECURE: "0"
      FIXTURES_PATH: /app/fixtures/fixtures.json
      UPLOAD_DIR: /data/uploads
      PORT: "8000"
    volumes:
      - uploads:/data/uploads
      - ./fixtures:/app/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

volumes:
  pgdata:
  uploads:
